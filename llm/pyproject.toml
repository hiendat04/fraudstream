[project]
name = "fraudstream-llm-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "mlx-lm>=0.19",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
