x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-fraudstream-local-jwt-secret-change-me}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:-fraudstream-local-api-secret-change-me}"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "${POSTGRES_DB:-fraudstream}"
    POSTGRES_USER: "${POSTGRES_USER:-fraudstream}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fraudstream_local_password}"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    FEAST_SPARK_MASTER: "local[4]"
    FEAST_REPO_PATH: /opt/airflow/project/feature_store/feature_repo
    PYSPARK_SUBMIT_ARGS: "--driver-memory 4g pyspark-shell"
    FRAUDSTREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    FRAUDSTREAM_WAREHOUSE_URI: "s3a://fraudstream/warehouse"
    MINIO_ENDPOINT: "http://minio:9000"
    MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-fraudstream}"
    MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-fraudstream_local_password}"
    PYTHONPATH: /opt/airflow/project/src:/opt/airflow/include
  volumes:
    - ./:/opt/airflow/project
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/include:/opt/airflow/include:ro
    - ./airflow/config:/opt/airflow/config:ro
    - ./airflow/scripts:/opt/airflow/scripts:ro
    - ./airflow/logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
  profiles: ["orchestration"]

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: fraudstream-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: fraudstream-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic financial_transactions \
          --partitions 24 \
          --replication-factor 1 \
          --config retention.ms=604800000 \
          --config cleanup.policy=delete

        kafka-topics --bootstrap-server kafka:29092 \
          --describe \
          --topic financial_transactions

        for topic in \
          financial_transactions_clean \
          financial_transactions_invalid \
          financial_transactions_duplicate \
          financial_transactions_late \
          fraud_features_customer_5m \
          fraud_features_merchant_5m \
          fraud_alerts
        do
          kafka-topics --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 24 \
            --replication-factor 1 \
            --config retention.ms=604800000 \
            --config cleanup.policy=delete \
            --config message.timestamp.type=LogAppendTime

          kafka-configs --bootstrap-server kafka:29092 \
            --alter \
            --entity-type topics \
            --entity-name "$$topic" \
            --add-config message.timestamp.type=LogAppendTime
        done

        kafka-topics --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fraudstream-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-18080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "fraudstream-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "false"

  postgres:
    image: postgres:16-alpine
    container_name: fraudstream-postgres
    # wal_level=logical is required for Debezium's Postgres connector (the
    # pgoutput plugin, built into stock Postgres since v10 -- no extension
    # needed). It only takes effect on a restart, not a reinitialize.
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fraudstream}"
      POSTGRES_USER: "${POSTGRES_USER:-fraudstream}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fraudstream_local_password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudstream} -d ${POSTGRES_DB:-fraudstream}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-schema-init:
    image: postgres:16-alpine
    container_name: fraudstream-postgres-schema-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fraudstream}"
      POSTGRES_USER: "${POSTGRES_USER:-fraudstream}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-fraudstream_local_password}"
    volumes:
      - ./infra/postgres/init/001_create_fraudstream_schema.sql:/schema/001_create_fraudstream_schema.sql:ro
      - ./infra/postgres/init/002_create_mlflow_database.sql:/schema/002_create_mlflow_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for file in /schema/*.sql; do
          psql \
            --host postgres \
            --username "${POSTGRES_USER:-fraudstream}" \
            --dbname "${POSTGRES_DB:-fraudstream}" \
            --set ON_ERROR_STOP=1 \
            --file "$$file"
        done

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: fraudstream-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-fraudstream}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-fraudstream_local_password}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-bucket-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: fraudstream-minio-bucket-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-fraudstream}" "${MINIO_ROOT_PASSWORD:-fraudstream_local_password}"
        mc mb --ignore-existing local/fraudstream

  mlflow:
    build:
      context: ./infra/mlflow
    image: fraudstream-mlflow:3.16.0
    container_name: fraudstream-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      postgres-schema-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-18085}:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-fraudstream}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-fraudstream_local_password}"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-fraudstream}:${POSTGRES_PASSWORD:-fraudstream_local_password}@postgres:5432/mlflow
      - --artifacts-destination=s3://fraudstream/mlflow
      - --serve-artifacts
      - --allowed-hosts=mlflow:5000,localhost,localhost:${MLFLOW_PORT:-18085},127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  trino:
    image: trinodb/trino:483
    container_name: fraudstream-trino
    # Host port defaults to 18082, not Trino's usual 8080: see the minio
    # service's port comment above -- 8080 is another common squat target.
    ports:
      - "${TRINO_PORT:-18082}:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy


  debezium-connect:
    image: quay.io/debezium/connect:3.6.0.Final
    container_name: fraudstream-debezium-connect
    # Host port defaults to 18083, continuing the 1808x convention used by
    # kafka-ui/airflow/trino above (8083 is Kafka Connect's usual REST port).
    ports:
      - "${DEBEZIUM_CONNECT_PORT:-18083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: fraudstream-debezium
      CONFIG_STORAGE_TOPIC: fraudstream_connect_configs
      OFFSET_STORAGE_TOPIC: fraudstream_connect_offsets
      STATUS_STORAGE_TOPIC: fraudstream_connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  debezium-connector-init:
    image: curlimages/curl:8.21.0
    container_name: fraudstream-debezium-connector-init
    depends_on:
      debezium-connect:
        condition: service_healthy
    volumes:
      - ./infra/debezium/bronze-raw-transactions-connector.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # PUT to the named connector's own config endpoint instead of POST
        # /connectors, so this is safe to re-run on every `docker compose up`
        # (creates the connector on first run, no-ops/updates on later ones).
        curl -sS -f -X PUT http://debezium-connect:8083/connectors/fraudstream-bronze-raw-transactions/config \
          -H "Content-Type: application/json" \
          -d @/connector.json
        echo
        curl -sS http://debezium-connect:8083/connectors/fraudstream-bronze-raw-transactions/status

  redis:
    # Feast 0.66 requires redis<8 on the client side; the 7.x server matches it.
    image: redis:7-alpine
    container_name: fraudstream-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redisinsight:
    # Browser UI for inspecting the Feast online store, the counterpart to
    # MinIO's console for the offline store. Nothing depends on it; it is a
    # read-only inspection tool.
    image: redis/redisinsight:2.70
    container_name: fraudstream-redisinsight
    # Host port continues the 1808x convention used by kafka-ui/airflow/trino
    # /debezium above; 5540 is RedisInsight's own port inside the container.
    ports:
      - "${REDISINSIGHT_PORT:-18084}:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["feature-store"]

  feast-stream-push:
    build:
      context: .
      dockerfile: feature_store/Dockerfile
    container_name: fraudstream-feast-stream-push
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      FRAUDSTREAM_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUDSTREAM_WAREHOUSE_URI: "s3a://fraudstream/warehouse"
      FEAST_SPARK_MASTER: "local[2]"

      FEAST_PUSH_BATCH_SIZE: "${FEAST_PUSH_BATCH_SIZE:-10000}"
      FEAST_PUSH_FLUSH_SECONDS: "${FEAST_PUSH_FLUSH_SECONDS:-30}"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-fraudstream}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-fraudstream_local_password}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-fraudstream}"
      POSTGRES_USER: "${POSTGRES_USER:-fraudstream}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fraudstream_local_password}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./:/opt/fraudstream
    profiles: ["feature-store"]

  airflow-db:
    image: postgres:16-alpine
    container_name: fraudstream-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles: ["orchestration"]

  airflow-init:
    <<: *airflow-common
    container_name: fraudstream-airflow-init
    command: ["bash", "/opt/airflow/scripts/initialize.sh"]

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraudstream-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: fraudstream-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    container_name: fraudstream-airflow-api-server
    command: api-server
    ports:
      - "${AIRFLOW_UI_PORT:-18081}:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  jenkins:
    build:
      context: ci/jenkins
    container_name: fraudstream-jenkins
    user: root
    restart: unless-stopped
    environment:
      KUBECONFIG: /var/jenkins_home/.kube/config
      HOME: /var/jenkins_home
    secrets:
      - JENKINS_ADMIN_PASSWORD
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - GITHUB_USER
      - GITHUB_TOKEN
    ports:
      - "${JENKINS_PORT:-18086}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./ci/jenkins/jenkins.yaml:/var/jenkins_home/casc/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AIRFLOW_PROJECT_DIR:-.}:/deploy
    networks:
      - default
      - kind
    profiles: ["ci"]

# Files under /run/secrets, so Jenkins can read them at start-up without every
# build inheriting them as environment variables.
secrets:
  JENKINS_ADMIN_PASSWORD:
    environment: JENKINS_ADMIN_PASSWORD
  POSTGRES_USER:
    environment: POSTGRES_USER
  POSTGRES_PASSWORD:
    environment: POSTGRES_PASSWORD
  MINIO_ACCESS_KEY:
    environment: MINIO_ACCESS_KEY
  MINIO_SECRET_KEY:
    environment: MINIO_SECRET_KEY
  GITHUB_USER:
    environment: GITHUB_USER
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN

networks:
  default:
  kind:
    external: true

volumes:
  kafka-data:
  postgres-data:
  minio-data:
  airflow-db-data:
  redis-data:
  redisinsight-data:
  jenkins-home:
