apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-4b
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-4b
  template:
    metadata:
      labels:
        app: qwen3-4b
        llm.fraudstream/server: llama-cpp
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server-b11610
          args:
            - --model
            - /models/Qwen3-4B-Q4_K_M.gguf
            - --alias
            - qwen3-4b
            - --jinja
            - --threads
            - "8"
            - --parallel
            - "1"
            - --ctx-size
            - "8192"
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-models
            readOnly: true
