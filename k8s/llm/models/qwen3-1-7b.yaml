apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-1-7b
  namespace: llm
spec:
  replicas: 0
  selector:
    matchLabels:
      app: qwen3-1-7b
  template:
    metadata:
      labels:
        app: qwen3-1-7b
        llm.fraudstream/server: llama-cpp
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server-b11610
          args:
            - --model
            - /models/Qwen3-1.7B-Q4_K_M.gguf
            - --alias
            - qwen3-1.7b
            - --jinja
            - --threads
            - "4"
            - --parallel
            - "2"
            - --ctx-size
            - "8192"
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2560Mi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-models
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-1-7b
  namespace: llm
spec:
  selector:
    app: qwen3-1-7b
  ports:
    - name: http
      port: 8000
      targetPort: http
