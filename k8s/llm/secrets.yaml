apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: llm
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-llm
spec:
  conditions:
    - namespaces: [llm]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: llm
          serviceAccountRef:
            name: vault-secrets
            namespace: llm
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-key-benchmark
  namespace: llm
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-llm
  target:
    name: llm-key-benchmark
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: llm/benchmark
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-key-agents
  namespace: llm
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-llm
  target:
    name: llm-key-agents
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: llm/agents
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-key-risk-agent-b
  namespace: llm
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-llm
  target:
    name: llm-key-risk-agent-b
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: llm/risk-agent-b
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-keys
  namespace: llm
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-llm
  target:
    name: llm-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        benchmark: '{"keyHash":"sha256:{{ .benchmark | sha256sum }}","metadata":{"consumer":"benchmark","models":["qwen3-4b","qwen3-1.7b"]}}'
        agents: '{"keyHash":"sha256:{{ .agents | sha256sum }}","metadata":{"consumer":"agents","models":["qwen3-4b"]}}'
        risk-agent-b: '{"keyHash":"sha256:{{ .risk_agent_b | sha256sum }}","metadata":{"consumer":"risk-agent-b","models":["qwen3-1.7b"]}}'
  data:
    - secretKey: benchmark
      remoteRef:
        key: llm/benchmark
        property: key
    - secretKey: agents
      remoteRef:
        key: llm/agents
        property: key
    - secretKey: risk_agent_b
      remoteRef:
        key: llm/risk-agent-b
        property: key
