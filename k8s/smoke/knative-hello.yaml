apiVersion: v1
kind: Namespace
metadata:
  name: platform-smoke
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: platform-smoke
spec:
  template:
    spec:
      containers:
        - image: hashicorp/http-echo:1.0
          args: ["-text=hello from knative", "-listen=:8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
