apiVersion: v1
kind: Namespace
metadata:
  name: platform-smoke
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: split
  namespace: platform-smoke
spec:
  template:
    metadata:
      name: split-v1
    spec:
      containers:
        - image: hashicorp/http-echo:1.0
          args: ["-text=v1", "-listen=:8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
