apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: mcp
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-mcp
spec:
  conditions:
    - namespaces: [mcp]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mcp
          serviceAccountRef:
            name: vault-secrets
            namespace: mcp
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-key-context-agent
  namespace: mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-mcp
  target:
    name: mcp-key-context-agent
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: mcp/context-agent
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-key-risk-agent
  namespace: mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-mcp
  target:
    name: mcp-key-risk-agent
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: mcp/risk-agent
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-key-mcp-check
  namespace: mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-mcp
  target:
    name: mcp-key-mcp-check
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: mcp/mcp-check
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-api-keys
  namespace: mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-mcp
  target:
    name: mcp-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        context-agent: '{"keyHash":"sha256:{{ .context_agent | sha256sum }}","metadata":{"consumer":"context-agent","servers":["fraud-context"]}}'
        risk-agent: '{"keyHash":"sha256:{{ .risk_agent | sha256sum }}","metadata":{"consumer":"risk-agent","servers":["fraud-risk"]}}'
        mcp-check: '{"keyHash":"sha256:{{ .mcp_check | sha256sum }}","metadata":{"consumer":"mcp-check","servers":["fraud-context","fraud-risk"]}}'
  data:
    - secretKey: context_agent
      remoteRef:
        key: mcp/context-agent
        property: key
    - secretKey: risk_agent
      remoteRef:
        key: mcp/risk-agent
        property: key
    - secretKey: mcp_check
      remoteRef:
        key: mcp/mcp-check
        property: key
