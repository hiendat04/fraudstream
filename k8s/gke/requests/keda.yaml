# GKE's CPU requests for KEDA (bootstrap.sh). The defaults are 100m each.
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keda-operator, namespace: keda}
spec: {template: {spec: {containers: [{name: keda-operator, resources: {requests: {cpu: 20m}}}]}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keda-metrics-apiserver, namespace: keda}
spec: {template: {spec: {containers: [{name: keda-metrics-apiserver, resources: {requests: {cpu: 20m}}}]}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keda-admission, namespace: keda}
spec: {template: {spec: {containers: [{name: keda-admission-webhooks, resources: {requests: {cpu: 20m}}}]}}}
