apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: fraudstream-apis
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-fraudstream-apis
spec:
  conditions:
    - namespaces: [fraudstream-apis]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: fraudstream-apis
          serviceAccountRef:
            name: vault-secrets
            namespace: fraudstream-apis
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feature-store-registry
  namespace: fraudstream-apis
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-fraudstream-apis
  target:
    name: feature-store-registry
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: platform/postgres
        property: login
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: platform/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-api
  namespace: fraudstream-apis
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-fraudstream-apis
  target:
    name: context-api
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: platform/postgres
        property: login
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: platform/postgres
        property: password
    - secretKey: PGVECTOR_USER
      remoteRef:
        key: platform/pgvector
        property: login
    - secretKey: PGVECTOR_PASSWORD
      remoteRef:
        key: platform/pgvector
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-htpasswd
  namespace: fraudstream-apis
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-fraudstream-apis
  target:
    name: gateway-htpasswd
    creationPolicy: Owner
    template:
      type: nginx.org/htpasswd
      engineVersion: v2
      data:
        htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: platform/gateway-htpasswd
        property: htpasswd
