apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: a2a-gateway
  namespace: kagent
spec:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: a2a-gateway
  namespace: kagent
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: a2a-gateway
  listeners:
    - name: a2a
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents
  namespace: kagent
spec:
  parentRefs:
    - name: a2a-gateway
      sectionName: a2a
  rules:
    - matches:
        - headers:
            - name: x-kagent-host
              value: context-agent.kagent
      backendRefs:
        - name: context-agent
          port: 8080
    - matches:
        - headers:
            - name: x-kagent-host
              value: risk-agent.kagent
      backendRefs:
        - name: risk-agent
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-tools
  namespace: kagent
spec:
  parentRefs:
    - name: a2a-gateway
      sectionName: a2a
  rules:
    - matches:
        - headers:
            - name: x-kagent-host
              value: mcp-gateway.mcp.svc.cluster.local
      backendRefs:
        - name: mcp-gateway
          namespace: mcp
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: a2a-gateway-mcp
  namespace: mcp
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kagent
  to:
    - group: ""
      kind: Service
      name: mcp-gateway
