apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: a2a-gateway
  namespace: kagent
spec:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: a2a-gateway
  namespace: kagent
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: a2a-gateway
  listeners:
    - name: a2a
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-agents
  namespace: kagent
spec:
  selector:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/component: controller
  ports:
    - name: a2a
      port: 8083
      targetPort: 8083
      appProtocol: kgateway.dev/a2a
---
apiVersion: v1
kind: Service
metadata:
  name: risk-agent-a
  namespace: kagent
spec:
  selector:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/component: controller
  ports:
    - name: a2a
      port: 8083
      targetPort: 8083
      appProtocol: kgateway.dev/a2a
---
apiVersion: v1
kind: Service
metadata:
  name: risk-agent-b
  namespace: kagent
spec:
  selector:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/component: controller
  ports:
    - name: a2a
      port: 8083
      targetPort: 8083
      appProtocol: kgateway.dev/a2a
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents
  namespace: kagent
spec:
  parentRefs:
    - name: a2a-gateway
      sectionName: a2a
  rules:
    - matches:
        - headers:
            - name: x-kagent-host
              value: kagent-controller.kagent
          path:
            type: PathPrefix
            value: /api/a2a-sandboxes/kagent/context-agent
      backendRefs:
        - name: sandbox-agents
          port: 8083
    - matches:
        - headers:
            - name: x-kagent-host
              value: kagent-controller.kagent
          path:
            type: PathPrefix
            value: /api/a2a-sandboxes/kagent/risk-agent
      backendRefs:
        - name: risk-agent-a
          port: 8083
          weight: 50
        - name: risk-agent-b
          port: 8083
          weight: 50
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /api/a2a-sandboxes/kagent/risk-agent-b
    - matches:
        - headers:
            - name: x-kagent-host
              value: kagent-controller.kagent
          path:
            type: PathPrefix
            value: /api/a2a-sandboxes/kagent/risk-agent/.well-known
      backendRefs:
        - name: sandbox-agents
          port: 8083
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-tools
  namespace: kagent
spec:
  parentRefs:
    - name: a2a-gateway
      sectionName: a2a
  rules:
    - matches:
        - headers:
            - name: x-kagent-host
              value: mcp-gateway.mcp.svc.cluster.local
      backendRefs:
        - name: mcp-gateway
          namespace: mcp
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: a2a-gateway-mcp
  namespace: mcp
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kagent
  to:
    - group: ""
      kind: Service
      name: mcp-gateway
