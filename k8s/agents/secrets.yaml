apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: kagent
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-kagent
spec:
  conditions:
    - namespaces: [kagent]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kagent
          serviceAccountRef:
            name: vault-secrets
            namespace: kagent
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: a2a-key-coordinator-agent
  namespace: kagent
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kagent
  target:
    name: a2a-key-coordinator-agent
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authorization: 'Bearer {{ .key }}'
  data:
    - secretKey: key
      remoteRef:
        key: a2a/coordinator-agent
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: a2a-key-a2a-check
  namespace: kagent
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kagent
  target:
    name: a2a-key-a2a-check
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authorization: 'Bearer {{ .key }}'
  data:
    - secretKey: key
      remoteRef:
        key: a2a/a2a-check
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: a2a-api-keys
  namespace: kagent
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kagent
  target:
    name: a2a-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        coordinator-agent: '{"keyHash":"sha256:{{ .coordinator_agent | sha256sum }}","metadata":{"consumer":"coordinator-agent","agents":["/api/a2a-sandboxes/kagent/context-agent","/api/a2a-sandboxes/kagent/risk-agent"]}}'
        a2a-check: '{"keyHash":"sha256:{{ .a2a_check | sha256sum }}","metadata":{"consumer":"a2a-check","agents":["/api/a2a-sandboxes/kagent/context-agent"]}}'
  data:
    - secretKey: coordinator_agent
      remoteRef:
        key: a2a/coordinator-agent
        property: key
    - secretKey: a2a_check
      remoteRef:
        key: a2a/a2a-check
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-llm-key
  namespace: kagent
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
