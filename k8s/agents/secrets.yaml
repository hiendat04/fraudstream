apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-htpasswd
  namespace: kagent
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kagent
  target:
    name: gateway-htpasswd
    creationPolicy: Owner
    template:
      type: nginx.org/htpasswd
      engineVersion: v2
      data:
        htpasswd: '{{ .htpasswd }}'
  data:
    - secretKey: htpasswd
      remoteRef:
        key: platform/gateway-htpasswd
        property: htpasswd
