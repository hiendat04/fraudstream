apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: fraud-context
spec:
  title: fraud-context
  description: A customer's or merchant's online features and handbook chunks by id, through the MCP gateway. Each agent calls it with its own key.
  remote:
    type: streamable-http
    url: http://mcp-gateway.mcp.svc.cluster.local:8080/mcp
---
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: contextagent
spec:
  title: Context agent
  description: Answers what the platform knows about a customer, a merchant or a handbook section. Runs on kagent as context-agent, with its prompt from MLflow.
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    repository:
      url: https://github.com/hiendat04/fraudstream
  mcpServers:
    - kind: MCPServer
      name: fraud-context
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: fraud-risk
spec:
  title: fraud-risk
  description: Scores a payment with the fraud detection model and searches the fraud handbook, through the MCP gateway. Each agent calls it with its own key.
  remote:
    type: streamable-http
    url: http://mcp-gateway.mcp.svc.cluster.local:8080/mcp
---
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: riskagent
spec:
  title: Risk agent
  description: Scores a payment with the fraud detection model and cites the handbook's steps. Runs on kagent as risk-agent, with its prompt from MLflow.
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    repository:
      url: https://github.com/hiendat04/fraudstream
  mcpServers:
    - kind: MCPServer
      name: fraud-risk
---
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: coordinatoragent
spec:
  title: Coordinator agent
  description: The fraud analysts' entry point. Delegates to context agent (contextagent) and risk agent (riskagent) through the A2A gateway. Runs on kagent as coordinator-agent, with its prompt from MLflow.
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    repository:
      url: https://github.com/hiendat04/fraudstream
