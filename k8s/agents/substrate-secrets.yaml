apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: ate-system
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-ate-system
spec:
  conditions:
    - namespaces: [ate-system]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ate-system
          serviceAccountRef:
            name: vault-secrets
            namespace: ate-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-rustfs
  namespace: ate-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-ate-system
  target:
    name: substrate-rustfs
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: agents/substrate-rustfs
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: agents/substrate-rustfs
        property: secret_key
