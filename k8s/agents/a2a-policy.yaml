apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: a2a-gateway
  namespace: kagent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: a2a-gateway
  frontend:
    metrics:
      attributes:
        add:
          - name: consumer
            expression: apiKey.consumer
    tracing:
      backendRef:
        name: jaeger
        namespace: observability
        port: 4317
      protocol: GRPC
      randomSampling: "true"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: a2a-gateway-traces
  namespace: observability
spec:
  from:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: kagent
  to:
    - group: ""
      kind: Service
      name: jaeger
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agents
  namespace: kagent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agents
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: a2a-api-keys
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - request.headers["x-kagent-host"] in apiKey.agents
    rateLimit:
      local:
        - {requests: 60, unit: Minutes, key: apiKey.consumer}
