apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: coordinator-agent
  namespace: kagent
spec:
  type: Declarative
  description: The fraud analysts' entry point. Asks the context agent and the risk agent through the A2A gateway and puts their answers together.
  declarative:
    modelConfig: default-model-config
    systemMessageFrom:
      type: ConfigMap
      name: coordinator-agent-prompt
      key: system-message
    tools:
      - type: Agent
        agent:
          kind: SandboxAgent
          name: context-agent
        isolateSessions: true
        headersFrom:
          - name: Authorization
            valueFrom:
              type: Secret
              name: a2a-key-coordinator-agent
              key: authorization
      - type: Agent
        agent:
          kind: SandboxAgent
          name: risk-agent
        isolateSessions: true
        headersFrom:
          - name: Authorization
            valueFrom:
              type: Secret
              name: a2a-key-coordinator-agent
              key: authorization
    a2aConfig:
      skills:
        - id: fraud-review
          name: Fraud review
          description: What the platform stores about a customer or merchant, and what the fraud detection model and the handbook say about a payment, put together from the two specialists.
          tags: [fraud, features, model, handbook]
          examples:
            - "Payment txn_000000128913: customer cust_00090571, merchant merch_00011503, 2026-06-22T23:59:21Z, 143.92 USD, online, New York. What do we know about the customer, and what should I do?"
            - Who has to agree before a payment above 5,000 USD is blocked?
  substrate:
    workerPoolRef:
      name: kagent-default
