apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: kubeflow
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-kubeflow
spec:
  conditions:
    - namespaces: [kubeflow]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kubeflow
          serviceAccountRef:
            name: vault-secrets
            namespace: kubeflow
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakehouse-credentials
  namespace: kubeflow
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kubeflow
  target:
    name: lakehouse-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: platform/postgres
        property: login
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: platform/postgres
        property: password
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: platform/minio
        property: login
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: platform/minio
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-htpasswd
  namespace: kubeflow
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kubeflow
  target:
    name: gateway-htpasswd
    creationPolicy: Owner
    template:
      type: nginx.org/htpasswd
      engineVersion: v2
      data:
        htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: platform/gateway-htpasswd
        property: htpasswd
