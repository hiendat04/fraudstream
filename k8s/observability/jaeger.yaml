apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger
  namespace: observability
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
        traces/agent-calls:
          receivers: [otlp]
          processors: [filter/agent-calls]
          exporters: [spanmetrics]
        metrics/agent-calls:
          receivers: [spanmetrics]
          exporters: [prometheus]
        traces/tool-calls:
          receivers: [otlp]
          processors: [filter/tool-calls]
          exporters: [spanmetrics/tools]
        metrics/tool-calls:
          receivers: [spanmetrics/tools]
          exporters: [prometheus]
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: memstore
      jaeger_storage:
        backends:
          memstore:
            memory:
              max_traces: 20000
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      filter/agent-calls:
        error_mode: ignore
        traces:
          span:
            - attributes["gen_ai.operation.name"] != "invoke_agent" or resource.attributes["service.name"] == "kagent-controller"
      filter/tool-calls:
        error_mode: ignore
        traces:
          span:
            - attributes["gen_ai.operation.name"] != "execute_tool" or attributes["gen_ai.tool.name"] == "(merged tools)"
    connectors:
      spanmetrics:
        namespace: agent
        dimensions:
          - name: gen_ai.agent.name
        histogram:
          unit: s
          explicit:
            buckets: [1s, 5s, 15s, 30s, 60s, 120s, 300s]
        metrics_flush_interval: 15s
      spanmetrics/tools:
        namespace: agent_tool
        dimensions:
          - name: gen_ai.tool.name
        histogram:
          unit: s
          explicit:
            buckets: [1s, 5s, 15s, 30s, 60s, 120s, 300s]
        metrics_flush_interval: 15s
    exporters:
      jaeger_storage_exporter:
        trace_storage: memstore
      prometheus:
        endpoint: 0.0.0.0:8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:JAEGER_VERSION
          args: ["--config", "/etc/jaeger/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8889
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
      volumes:
        - name: config
          configMap:
            name: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
