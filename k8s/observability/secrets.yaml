apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: observability
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-observability
spec:
  conditions:
    - namespaces: [observability]
  provider:
    vault:
      server: https://vault:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: observability
          serviceAccountRef:
            name: vault-secrets
            namespace: observability
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-observability
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/gateway
        property: login
    - secretKey: admin-password
      remoteRef:
        key: platform/gateway
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-htpasswd
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-observability
  target:
    name: gateway-htpasswd
    creationPolicy: Owner
    template:
      type: nginx.org/htpasswd
      engineVersion: v2
      data:
        htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: platform/gateway-htpasswd
        property: htpasswd
