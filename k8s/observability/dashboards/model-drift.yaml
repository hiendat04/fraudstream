apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-model-drift
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  model-drift.json: |
    {
      "uid": "fraudstream-model-drift",
      "title": "FraudStream · Model inputs and drift",
      "tags": ["fraudstream", "ml"],
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {"from": "now-7d", "to": "now"},
      "templating": {"list": [
        {"name": "window_end", "label": "Window ending", "type": "query",
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "query": {"query": "label_values(fraud_drift_rows, window_end)", "refId": "window_end"},
         "definition": "label_values(fraud_drift_rows, window_end)", "sort": 2, "refresh": 2}
      ]},
      "panels": [
        {"id": 1, "type": "stat", "title": "Status", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 6},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {
           "-1": {"text": "Not enough data", "color": "text"},
           "0": {"text": "Stable", "color": "green"},
           "1": {"text": "Warning", "color": "orange"},
           "2": {"text": "Drift", "color": "red"}}}]}, "overrides": []},
         "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "fraud_drift_status{job=\"fraud_drift\",window_end=\"$window_end\"}", "instant": true}]},
        {"id": 2, "type": "stat", "title": "Payments checked", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 6},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "fraud_drift_rows{job=\"fraud_drift\",window_end=\"$window_end\"}", "instant": true}]},
        {"id": 3, "type": "stat", "title": "Inputs in drift / warning", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 6},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [
           {"refId": "A", "expr": "fraud_drift_features_drifted{job=\"fraud_drift\",window_end=\"$window_end\"}", "legendFormat": "drift", "instant": true},
           {"refId": "B", "expr": "fraud_drift_features_warning{job=\"fraud_drift\",window_end=\"$window_end\"}", "legendFormat": "warning", "instant": true}]},
        {"id": 4, "type": "stat", "title": "Last retrain started", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 6},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "dateTimeFromNow"}, "overrides": []},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "max(fraud_retrain_started_timestamp_seconds) * 1000", "instant": true}]},
        {"id": 5, "type": "bargauge", "title": "PSI by input, largest first", "gridPos": {"x": 0, "y": 6, "w": 12, "h": 14},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"min": 0, "max": 1, "decimals": 3,
           "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.1}, {"color": "red", "value": 0.25}]}}, "overrides": []},
         "options": {"orientation": "horizontal", "displayMode": "gradient", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "sort_desc(topk(15, fraud_drift_feature_psi{job=\"fraud_drift\",window_end=\"$window_end\"}))", "legendFormat": "{{feature}}", "instant": true}]},
        {"id": 6, "type": "bargauge", "title": "Inputs in drift, by window", "gridPos": {"x": 12, "y": 6, "w": 12, "h": 7},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"min": 0, "decimals": 0,
           "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
         "options": {"orientation": "vertical", "displayMode": "basic", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "max by (window_end) (fraud_drift_features_drifted{job=\"fraud_drift\"})", "legendFormat": "{{window_end}}", "instant": true}]},
        {"id": 7, "type": "bargauge", "title": "Payments with history (window)", "gridPos": {"x": 12, "y": 13, "w": 12, "h": 7},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
         "options": {"orientation": "horizontal", "displayMode": "basic", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "fraud_drift_history_available_ratio{job=\"fraud_drift\",window_end=\"$window_end\"}", "legendFormat": "{{flag}}", "instant": true}]},
        {"id": 8, "type": "timeseries", "title": "What the model answers (live)", "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"min": 0, "max": 1}, "overrides": []},
         "targets": [
           {"refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(fraud_score_bucket[15m])))", "legendFormat": "median score"},
           {"refId": "B", "expr": "histogram_quantile(0.90, sum by (le) (rate(fraud_score_bucket[15m])))", "legendFormat": "90th percentile"}]},
        {"id": 9, "type": "timeseries", "title": "Payments scored without history (live)", "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (flag) (rate(fraud_history_missing_total[15m])) / scalar(sum(rate(fraud_score_count[15m])))", "legendFormat": "{{flag}}"}]}
      ]
    }
