apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-agents
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  agents.json: |
    {
      "uid": "fraudstream-agents",
      "title": "FraudStream · Agents",
      "tags": ["fraudstream", "agents"],
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Calls per agent", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value_and_name"}, "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (gen_ai_agent_name) (increase(agent_calls_total[$__range]))", "legendFormat": "{{gen_ai_agent_name}}", "instant": true}]},
        {"id": 2, "type": "timeseries", "title": "Agent calls per minute, by agent and status", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (gen_ai_agent_name, status_code) (rate(agent_calls_total[5m])) * 60", "legendFormat": "{{gen_ai_agent_name}} · {{status_code}}"}]},
        {"id": 3, "type": "timeseries", "title": "Calls in flight and replicas", "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (gen_ai_agent_name) (rate(agent_duration_seconds_sum[2m]))", "legendFormat": "in flight · {{gen_ai_agent_name}}"}, {"refId": "B", "expr": "kube_deployment_status_replicas_available{namespace=\"kagent\", deployment!~\"kagent-.*\"}", "legendFormat": "replicas · {{deployment}}"}]},
        {"id": 4, "type": "timeseries", "title": "Agent call time p50 and p95", "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "histogram_quantile(0.5, sum by (le, gen_ai_agent_name) (rate(agent_duration_seconds_bucket[5m])))", "legendFormat": "p50 · {{gen_ai_agent_name}}"}, {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le, gen_ai_agent_name) (rate(agent_duration_seconds_bucket[5m])))", "legendFormat": "p95 · {{gen_ai_agent_name}}"}]},
        {"id": 5, "type": "stat", "title": "Calls per MCP tool", "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value_and_name"}, "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (server, tool) (increase(mcp_tool_calls_total[$__range]))", "legendFormat": "{{tool}}", "instant": true}]},
        {"id": 6, "type": "stat", "title": "Failures per MCP tool, by outcome", "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value_and_name"}, "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (server, tool, outcome) (increase(mcp_tool_calls_total{outcome!=\"ok\"}[$__range]))", "legendFormat": "{{tool}} · {{outcome}}", "instant": true}]},
        {"id": 7, "type": "timeseries", "title": "Tool calls per agent, at the MCP gateway", "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (consumer, resource) (rate(agentgateway_mcp_requests_total{method=\"tools/call\"}[5m])) * 60", "legendFormat": "{{consumer}} · {{resource}}"}]},
        {"id": 8, "type": "timeseries", "title": "Tool call time p95", "gridPos": {"x": 12, "y": 24, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le, tool) (rate(mcp_tool_call_duration_seconds_bucket[5m])))", "legendFormat": "{{tool}}"}]},
        {"id": 9, "type": "timeseries", "title": "Calls between agents, at the A2A gateway", "gridPos": {"x": 0, "y": 32, "w": 24, "h": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "targets": [{"refId": "A", "expr": "sum by (consumer, backend, status) (rate(agentgateway_requests_total{gateway=\"kagent/a2a-gateway\", protocol=\"a2a\"}[5m])) * 60", "legendFormat": "{{consumer}} → {{backend}} · {{status}}"}]}
      ]
    }
