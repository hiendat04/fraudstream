apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-llm
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  llm.json: |
    {
      "uid": "fraudstream-llm",
      "title": "FraudStream · LLM",
      "tags": ["fraudstream", "llm"],
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Requests per second by model and consumer", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (gen_ai_request_model, consumer) (rate(agentgateway_gen_ai_server_request_duration_count[5m]))", "legendFormat": "{{gen_ai_request_model}} · {{consumer}}"}]},
        {"id": 2, "type": "timeseries", "title": "Output tokens per second, per model-server pod", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (pod) (rate(llamacpp:tokens_predicted_total[5m]))", "legendFormat": "{{pod}}"}]},
        {"id": 3, "type": "timeseries", "title": "Time to first token", "gridPos": {"x": 0, "y": 8, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
         "targets": [
           {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_time_to_first_token_bucket[5m])))", "legendFormat": "p50 · {{gen_ai_request_model}}"},
           {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_time_to_first_token_bucket[5m])))", "legendFormat": "p95 · {{gen_ai_request_model}}"}]},
        {"id": 4, "type": "timeseries", "title": "Time per output token", "gridPos": {"x": 8, "y": 8, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
         "targets": [
           {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_time_per_output_token_bucket[5m])))", "legendFormat": "p50 · {{gen_ai_request_model}}"},
           {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_time_per_output_token_bucket[5m])))", "legendFormat": "p95 · {{gen_ai_request_model}}"}]},
        {"id": 5, "type": "timeseries", "title": "Round trip of a generation", "gridPos": {"x": 16, "y": 8, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
         "targets": [
           {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_request_duration_bucket[5m])))", "legendFormat": "p50 · {{gen_ai_request_model}}"},
           {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_request_duration_bucket[5m])))", "legendFormat": "p95 · {{gen_ai_request_model}}"}]},
        {"id": 6, "type": "timeseries", "title": "Tokens per request: input, output, total", "gridPos": {"x": 0, "y": 16, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
         "targets": [
           {"refId": "A", "expr": "sum by (gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_sum[5m])) / sum by (gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_count[5m]))", "legendFormat": "{{gen_ai_token_type}}"},
           {"refId": "B", "expr": "sum(rate(agentgateway_gen_ai_client_token_usage_sum[5m])) / sum(rate(agentgateway_gen_ai_server_request_duration_count[5m]))", "legendFormat": "total"}]},
        {"id": 7, "type": "bargauge", "title": "Tokens by consumer (last hour)", "gridPos": {"x": 8, "y": 16, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "horizontal"},
         "targets": [{"refId": "A", "expr": "sum by (consumer) (increase(agentgateway_gen_ai_client_token_usage_sum[1h]))", "legendFormat": "{{consumer}}", "instant": true}]},
        {"id": 8, "type": "timeseries", "title": "Requests waiting and running, per pod", "gridPos": {"x": 16, "y": 16, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
         "targets": [
           {"refId": "A", "expr": "sum by (pod) (llamacpp:requests_deferred)", "legendFormat": "waiting · {{pod}}"},
           {"refId": "B", "expr": "sum by (pod) (llamacpp:requests_processing)", "legendFormat": "running · {{pod}}"}]},
        {"id": 9, "type": "timeseries", "title": "Refused requests per minute", "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (status) (rate(agentgateway_requests_total{status=~\"401|403|404|429\"}[5m])) * 60", "legendFormat": "{{status}}"}]},
        {"id": 10, "type": "timeseries", "title": "Caught by the PII guard per minute", "gridPos": {"x": 12, "y": 24, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (phase, action) (rate(agentgateway_guardrail_checks_total{action!~\"[Aa]llow\"}[5m])) * 60", "legendFormat": "{{phase}} · {{action}}"}]},
        {"id": 11, "type": "stat", "title": "Share of prompts caught (last hour)", "gridPos": {"x": 20, "y": 24, "w": 4, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 1}, "overrides": []},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
         "targets": [{"refId": "A", "expr": "sum(increase(agentgateway_guardrail_checks_total{phase=~\"[Rr]equest\", action!~\"[Aa]llow\"}[1h])) / sum(increase(agentgateway_guardrail_checks_total{phase=~\"[Rr]equest\"}[1h]))", "instant": true}]}
      ]
    }
