jenkins:
  systemMessage: "FraudStream CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:18086/"
  hashicorpVault:
    configuration:
      vaultUrl: "https://vault:8200"
      vaultCredentialId: "vault-approle"
      engineVersion: 2

credentials:
  system:
    domainCredentials:
      - credentials:
          - vaultAppRoleCredential:
              scope: GLOBAL
              id: "vault-approle"
              path: "approle"
              roleId: "${VAULT_ROLE_ID}"
              secretId: "${VAULT_SECRET_ID}"
          - vaultUsernamePasswordCredentialImpl:
              scope: GLOBAL
              id: "minio"
              path: "secret/platform/minio"
              usernameKey: "login"
              passwordKey: "password"
              engineVersion: 2
          - vaultUsernamePasswordCredentialImpl:
              scope: GLOBAL
              id: "github"
              path: "secret/ci/github"
              usernameKey: "username"
              passwordKey: "token"
              engineVersion: 2
          - vaultUsernamePasswordCredentialImpl:
              scope: GLOBAL
              id: "gateway"
              path: "secret/platform/gateway"
              usernameKey: "login"
              passwordKey: "password"
              engineVersion: 2

jobs:
  - script: |
      multibranchPipelineJob('fraudstream') {
        branchSources {
          git {
            id('fraudstream')
            remote('https://github.com/hiendat04/fraudstream.git')
            credentialsId('github')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(5)
          }
        }
        triggers {
          cron('H/5 * * * *')
        }
      }
  - script: |
      pipelineJob('fraudstream-model-rollout') {
        description('Steps a model canary through k8s/models/rollout.yaml, judged by Prometheus.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/hiendat04/fraudstream.git')
                  credentials('github')
                }
                branch('feature/e2e-fraudstream-platform')
              }
            }
            scriptPath('cicd/jenkins/model-rollout.Jenkinsfile')
          }
        }
      }
