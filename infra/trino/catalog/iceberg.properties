connector.name=iceberg

# Reuses the exact same Iceberg JDBC catalog Spark and Flink already write
# through (see fraudstream.jobs.warehouse.configure_iceberg_catalog and
# fraudstream.jobs.flink.iceberg_sink) -- no Hive Metastore needed. Trino's
# Iceberg connector has supported a JDBC catalog since Trino 406, using the
# same iceberg_tables/iceberg_namespace_properties bookkeeping tables that
# Iceberg's own JdbcCatalog already creates in PostgreSQL.
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=iceberg
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/fraudstream
iceberg.jdbc-catalog.connection-user=${ENV:POSTGRES_USER}
iceberg.jdbc-catalog.connection-password=${ENV:POSTGRES_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://fraudstream/warehouse
iceberg.jdbc-catalog.schema-version=V1

# MinIO, via Trino's native S3 filesystem support -- same endpoint/credentials
# every other engine in this project uses (fraudstream.jobs.warehouse).
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
s3.path-style-access=true
# MinIO ignores region, but Trino's S3 client (AWS SDK v2) still requires one
# to be resolvable -- there's no AWS_REGION/profile/EC2-metadata available in
# this environment, so the SDK's default region chain fails without this.
s3.region=us-east-1
