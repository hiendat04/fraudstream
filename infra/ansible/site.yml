- name: Configure the platform VM
  hosts: platform
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for the VM to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - docker
    - vault
    - platform
    - datahub
    - seed
