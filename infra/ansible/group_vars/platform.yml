fraudstream_dir: /opt/fraudstream
deploy_dir: /opt/fraudstream-deploy
postgres_db: fraudstream
# A Postgres command run as the container's own login, so Ansible looks up no secret. That
# also avoids a Vault lookup, whose forked worker dies on macOS looking up the system proxy.
postgres_exec: >-
  docker exec -i fraudstream-postgres sh -c 'PGUSER=$POSTGRES_USER exec "$0" "$@"'
# The VM has no Vault CLI: the one inside Vault's container, with the token from the caller's environment.
vault_cli: >-
  docker exec -i -e VAULT_TOKEN -e VAULT_ADDR=https://127.0.0.1:8200 -e VAULT_CACERT=/vault/tls/ca.crt
  fraudstream-vault vault
# The same .env as the full stack, so starting it later doesn't recreate Vault, which would seal it.
vault_compose: docker compose --env-file .env -f infra/vault/compose.yml
platform_compose: >-
  docker compose -f docker-compose.yml -f docker-compose.cloud.yml
  --profile orchestration --profile feature-store --profile ci
# Vault's API from the VM itself, under the name its certificate carries.
vault_api: >-
  curl -sf --cacert infra/vault/tls/ca.crt --connect-to vault:8200:{{ internal_ip }}:8200
# The local's login, sent over SSH stdin. It is valid on the VM because the snapshot carries it.
vault_token: "{{ lookup('env', 'VAULT_TOKEN') or lookup('file', '~/.vault-token') }}"
