# Tables, not the schema: --clean would otherwise drop public, which the VM's Iceberg tables live in.
- name: Dump the Feast registry from the local stack
  ansible.builtin.shell: >-
    {{ postgres_exec }} pg_dump -d fraudstream
    -t 'public.*' -T 'public.iceberg_*' --no-owner --no-privileges -Fc > {{ seed_local_dir }}/feast_registry.dump
  delegate_to: localhost
  become: false
  changed_when: true

- name: Copy the registry dump to the VM
  ansible.builtin.copy:
    src: "{{ seed_local_dir }}/feast_registry.dump"
    dest: "{{ seed_remote_dir }}/feast_registry.dump"
    mode: "0600"

- name: Restore the Feast registry
  ansible.builtin.shell: >-
    {{ postgres_exec }} pg_restore -d {{ postgres_db }}
    --no-owner --no-privileges --clean --if-exists < {{ seed_remote_dir }}/feast_registry.dump
  changed_when: true
