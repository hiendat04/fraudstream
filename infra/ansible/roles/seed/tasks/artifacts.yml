- name: Export the model files from the local MinIO
  ansible.builtin.shell: >-
    docker exec fraudstream-minio sh -c
    'mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
    && rm -rf /tmp/mlflow-export && mc mirror --quiet local/fraudstream/mlflow /tmp/mlflow-export'
    && rm -rf {{ seed_local_dir }}/mlflow-artifacts
    && docker cp fraudstream-minio:/tmp/mlflow-export {{ seed_local_dir }}/mlflow-artifacts
  delegate_to: localhost
  become: false
  changed_when: true

- name: Upload the model files to the bucket
  ansible.builtin.command: >-
    gcloud storage rsync --recursive {{ seed_local_dir }}/mlflow-artifacts gs://{{ models_bucket }}/mlflow
  delegate_to: localhost
  become: false
  changed_when: true
