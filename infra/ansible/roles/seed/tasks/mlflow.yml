- name: Dump the MLflow database from the local stack
  ansible.builtin.shell: >-
    docker exec fraudstream-postgres pg_dump -U {{ seed_local_postgres_user }} -d mlflow
    --no-owner --no-privileges -Fc > {{ seed_local_dir }}/mlflow.dump
  delegate_to: localhost
  become: false
  changed_when: true

- name: Copy the MLflow dump to the VM
  ansible.builtin.copy:
    src: "{{ seed_local_dir }}/mlflow.dump"
    dest: "{{ seed_remote_dir }}/mlflow.dump"
    mode: "0600"

- name: Restore the MLflow database
  ansible.builtin.shell: >-
    docker exec -i fraudstream-postgres pg_restore -U {{ postgres_user }} -d mlflow
    --no-owner --no-privileges --clean --if-exists < {{ seed_remote_dir }}/mlflow.dump
  changed_when: true
  notify: Restart MLflow
