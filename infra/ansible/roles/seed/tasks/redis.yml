- name: Snapshot the local online store
  ansible.builtin.shell: >-
    docker exec fraudstream-redis redis-cli SAVE
    && docker cp fraudstream-redis:/data/dump.rdb {{ seed_local_dir }}/redis.rdb
  delegate_to: localhost
  become: false
  changed_when: true

- name: Copy the snapshot to the VM
  ansible.builtin.copy:
    src: "{{ seed_local_dir }}/redis.rdb"
    dest: "{{ seed_remote_dir }}/redis.rdb"
    mode: "0600"

# Copied after the stop, which saves Redis's own data over the file.
- name: Start Redis on the snapshot
  ansible.builtin.shell: >-
    docker stop fraudstream-redis
    && docker cp {{ seed_remote_dir }}/redis.rdb fraudstream-redis:/data/dump.rdb
    && docker start fraudstream-redis
  changed_when: true
