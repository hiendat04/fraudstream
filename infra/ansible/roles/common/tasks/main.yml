- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
      - python3-yaml
    update_cache: true
    cache_valid_time: 3600

- name: Create the FraudStream directory
  ansible.builtin.file:
    path: "{{ fraudstream_dir }}"
    state: directory
    mode: "0755"
