[project]
name = "fraudstream-ml"
version = "0.1.0"
description = "Fraud model training over the Feast offline store"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feast[spark,postgres,redis]==0.66.0",
    "pyspark==4.1.2",
    "xgboost>=2.1,<4",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "joblib>=1.4,<2",
    "mlflow==3.16.0",
    "matplotlib>=3.9,<4",
    "jupyterlab>=4.2,<5",
]

[tool.uv]
package = false
