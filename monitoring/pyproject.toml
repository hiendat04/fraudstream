[project]
name = "fraudstream-monitoring"
version = "0.1.0"
description = "The drift check and retrain trigger behind the Airflow monitoring pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "httpx==0.28.1",
    "prometheus-client==0.24.1",
    "pyyaml==6.0.3",
    "nannyml==0.13.1",
    "statsmodels==0.14.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
# Loads registered model versions and reads their rows through Trino.
scoring = [
    "mlflow==3.16.0",
    "xgboost==3.4.1",
    "trino==0.339.0",
]

[tool.uv]
package = false
# NannyML pulls FLAML, which caps xgboost below 3, but only its DLE estimator uses it.
# The model needs 3.4.1 to load; CBPE never touches FLAML.
# kaleido 0.2.1.post1 ships one 32-bit ARM wheel; 0.2.1 has the Mac and Linux ones.
override-dependencies = ["xgboost==3.4.1", "kaleido==0.2.1"]

[tool.pytest.ini_options]
pythonpath = ["src", "../api/src", "../ml/src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/fraudstream_monitoring"]

[tool.coverage.report]
show_missing = true
exclude_also = ["def main\\(", "if __name__ == .__main__.:"]
fail_under = 90
