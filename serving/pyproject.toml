[project]
name = "fraudstream-serving"
version = "0.1.0"
description = "Serves the registered fraud model behind KServe"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kserve==0.20.0",
    "mlflow==3.16.0",
    "xgboost==3.4.1",
    "pandas>=2.2,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.0",
    "hypothesis-crosshair==0.0.30",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/fraudstream_serving"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
fail_under = 90

