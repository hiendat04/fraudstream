[project]
name = "fraudstream-api"
version = "0.1.0"
description = "The web APIs: fraud inference and real-time drift detection"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
inference = [
    "feast[redis,postgres]==0.66.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "pandas>=2.2,<3",
]
drift = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic-settings==2.15.0",
    "redis==7.4.1",
    "numpy>=2,<3",
]

[dependency-groups]
dev = [
    "fakeredis==2.38.0",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mutmut==3.8.0",
    "hypothesis==6.168.0",
    "hypothesis-crosshair==0.0.30",
]
reference = [
    "trino==0.339.0",
    "pandas>=2.2,<3",
]
loadtest = [
    "locust==2.46.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "../ml/src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/fraudstream_api"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
fail_under = 90

[tool.mutmut]
source_paths = ["src/fraudstream_api"]
pytest_add_cli_args_test_selection = ["tests"]
