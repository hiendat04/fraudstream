project: fraudstream
provider: local
entity_key_serialization_version: 3

registry:
  registry_type: sql
  path: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  cache_ttl_seconds: 60

online_store:
  type: redis
  connection_string: ${REDIS_HOST}:${REDIS_PORT}
  key_ttl_seconds: 7862400

offline_store:
  type: spark
  spark_conf:
    spark.master: ${FEAST_SPARK_MASTER}
    spark.app.name: FraudStreamFeastOfflineStore
    spark.sql.shuffle.partitions: "8"
    spark.sql.session.timeZone: UTC
    spark.jars.packages: org.apache.hadoop:hadoop-aws:3.4.1,org.postgresql:postgresql:42.7.4,org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.11.0
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.iceberg: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.iceberg.catalog-impl: org.apache.iceberg.jdbc.JdbcCatalog
    spark.sql.catalog.iceberg.uri: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    spark.sql.catalog.iceberg.jdbc.user: ${POSTGRES_USER}
    spark.sql.catalog.iceberg.jdbc.password: ${POSTGRES_PASSWORD}
    spark.sql.catalog.iceberg.jdbc.schema-version: V1
    spark.sql.catalog.iceberg.warehouse: ${FRAUDSTREAM_WAREHOUSE_URI}
    spark.sql.catalog.iceberg.io-impl: org.apache.iceberg.hadoop.HadoopFileIO
    spark.hadoop.fs.s3a.endpoint: ${MINIO_ENDPOINT}
    spark.hadoop.fs.s3a.access.key: ${MINIO_ACCESS_KEY}
    spark.hadoop.fs.s3a.secret.key: ${MINIO_SECRET_KEY}
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
